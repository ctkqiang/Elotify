name: Deploy to Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint || true

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Run tests
        run: bun run test || true
        continue-on-error: true

      - name: Build application
        run: bun run build || echo "No build script defined"

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=dev-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to development
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "⚠️  Deployment skipped: Missing deployment secrets"
            echo "Configure DEPLOY_KEY and DEPLOY_HOST in GitHub repository settings"
            exit 0
          fi

          # Setup SSH
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${DEPLOY_PORT:-22} $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null

          # Deploy
          ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT:-22} ${DEPLOY_USER}@${DEPLOY_HOST} << 'EOFSH'
            cd /app/push-notification-service
            docker-compose pull
            docker-compose down
            docker-compose up -d
            docker-compose exec -T postgres psql -U postgres -d push_notifications << 'DBEOF'
            INSERT INTO admins (id, name, username, role)
            VALUES (0, 'Test Admin', 'test-admin', 'SUPER_ADMIN')
            ON CONFLICT DO NOTHING;

            INSERT INTO locales (id, name)
            VALUES ('en', 'English'), ('zh', 'Chinese'), ('ms', 'Malay')
            ON CONFLICT DO NOTHING;
            DBEOF
          EOFSH

          rm ~/.ssh/deploy_key

      - name: Health check
        if: always()
        run: |
          echo "Waiting for service to be healthy..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Service is healthy"
              exit 0
            fi
            echo "Attempt $i/30... waiting"
            sleep 2
          done
          echo "⚠️  Service health check timeout"
          exit 1
        continue-on-error: true

  notify:
    needs: [build-and-test, docker-build-push, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=✅ Deployment Successful" >> $GITHUB_OUTPUT
            echo "color=28a745" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" == "skipped" ]; then
            echo "status=ℹ️  Deployment Skipped" >> $GITHUB_OUTPUT
            echo "color=0366d6" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Deployment Failed" >> $GITHUB_OUTPUT
            echo "color=cb2431" >> $GITHUB_OUTPUT
          fi

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << SUMMEOF
          ## ${{ steps.status.outputs.status }}

          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          **Author**: ${{ github.actor }}

          ### Jobs Status
          - **Build & Test**: ${{ needs.build-and-test.result }}
          - **Docker Build & Push**: ${{ needs.docker-build-push.result }}
          - **Deploy**: ${{ needs.deploy.result }}

          [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          SUMMEOF

  cleanup:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Clean up old images
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser({
              package_type: 'container',
              package_name: 'push-notification-service',
            });

            const toDelete = res.data.slice(5);
            for (const pkg of toDelete) {
              await github.rest.packages.deletePackageVersionForAuthenticatedUser({
                package_type: 'container',
                package_name: 'push-notification-service',
                package_version_id: pkg.id,
              });
            }
        continue-on-error: true
