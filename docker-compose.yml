version: "3.8"
services:
  mongodb:
    image: mongo:6.0-focal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - pushservice-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  pushservice:
    build: .
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      - DOCKER_ENV=true
      - MONGODB_HOST=mongodb
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - pushservice-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8082/swagger/index.html",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:

networks:
  pushservice-network:
    driver: bridge
